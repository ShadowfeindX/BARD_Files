name: content_core
description: "D's default rules pack as data under assets/."
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dev_dependencies:
  flutter_lints: 6.0.0
  test: 1.31.1

# The pack ships as generated assets: `bash tool/build_pack.sh` strips
# assets/example-core/ into assets/generated/example-core/ (not in git).
# Flutter lists asset folders one level at a time.
flutter:
  assets:
    - assets/generated/example-core/
    - assets/generated/example-core/items/
    - assets/generated/example-core/npcs/
    - assets/generated/example-core/strings/
    - assets/generated/example-core/techniques/
