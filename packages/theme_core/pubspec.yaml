name: theme_core
description: "Pure-Dart theme model: tokens, codec, validator and resolver. Built-in themes are JSON assets."
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dev_dependencies:
  flutter_lints: 6.0.0
  test: 1.31.1

# The built-in themes are hand-edited JSON (CLAUDE.md §9). Nothing is
# generated. The package never reads them itself: ui_kit loads them through
# the Flutter asset bundle and passes the strings to ThemeCodec.
flutter:
  assets:
    - assets/themes/
