# Proposed in docs/architecture/08-testing.md (Continuous integration); the
# implementation plan's decision 5 approved it. Linux only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter comes straight from Google storage (CLAUDE.md §6: no other
      # install source). The version is the single line in .flutter-version.
      - name: Install Flutter
        run: |
          version="$(cat .flutter-version)"
          curl -sSfL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${version}-stable.tar.xz"
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve workspace
        run: flutter pub get

      # The shipped pack is generated from the annotated source and kept out
      # of git; apps and content_core declare it as assets.
      - name: Build rules pack
        run: bash tool/build_pack.sh

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Dependency rules
        run: dart run tool/bin/check_dependency_rules.dart

      - name: Exact pins
        run: dart run tool/bin/check_pins.dart

      - name: Rules pack is current
        run: bash tool/build_pack.sh --check

      - name: Tests
        run: bash tool/test_all.sh

      # Known-seed RNG vectors and engine tests must also pass on the web
      # (P5; 01-engine.md RNG): Node.js is preinstalled on the runner.
      - name: Web tests (engine, session)
        run: |
          (cd packages/engine && dart test -p node)
          (cd packages/session && dart test -p node)
